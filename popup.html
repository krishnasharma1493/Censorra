<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 0;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .header {
      padding: 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }
    
    .header h1 {
      margin: 0 0 5px 0;
      font-size: 18px;
      font-weight: 600;
    }
    
    .header p {
      margin: 0;
      font-size: 12px;
      opacity: 0.8;
    }
    
    .content {
      padding: 20px;
    }
    
    .setting-group {
      margin-bottom: 20px;
    }
    
    .setting-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.3);
      transition: 0.3s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #4CAF50;
    }
    
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    
    .radio-group {
      display: flex;
      gap: 10px;
    }
    
    .radio-option {
      flex: 1;
      position: relative;
    }
    
    .radio-option input[type="radio"] {
      position: absolute;
      opacity: 0;
    }
    
    .radio-option label {
      display: block;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid transparent;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 12px;
    }
    
    .radio-option input[type="radio"]:checked + label {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.5);
    }
    
    .stats {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
    }
    
    .stats h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
    }
    
    .stat-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 12px;
    }
    
    .footer {
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.2);
      text-align: center;
      font-size: 11px;
      opacity: 0.8;
    }
    
    .disabled {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡️ NSFW Blocker</h1>
    <p>AI-powered image protection</p>
  </div>
  
  <div class="content">
    <div class="setting-group">
      <label class="setting-label">
        Enable Protection
        <div style="float: right;">
          <label class="toggle-switch">
            <input type="checkbox" id="blockingEnabled">
            <span class="slider"></span>
          </label>
        </div>
      </label>
    </div>
    
    <div class="setting-group" id="modeSettings">
      <label class="setting-label">Blocking Mode</label>
      <div class="radio-group">
        <div class="radio-option">
          <input type="radio" id="blurMode" name="blockingMode" value="blur">
          <label for="blurMode">Blur</label>
        </div>
        <div class="radio-option">
          <input type="radio" id="replaceMode" name="blockingMode" value="replace">
          <label for="replaceMode">Replace</label>
        </div>
      </div>
    </div>
    
    <div class="stats">
      <h3>Session Stats</h3>
      <div class="stat-item">
        <span>Images Scanned:</span>
        <span id="imagesScanned">0</span>
      </div>
      <div class="stat-item">
        <span>Content Blocked:</span>
        <span id="contentBlocked">0</span>
      </div>
      <div class="stat-item">
        <span>Status:</span>
        <span id="status">Active</span>
      </div>
    </div>
  </div>
  
  <div class="footer">
    Made for hackathon • v1.0
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
